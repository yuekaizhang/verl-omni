# @package _global_
# Qwen3-TTS GRPO recipe (verl-omni)
#
# Inherits the full upstream PPO config schema (`ppo_base.yaml`, which is a
# verbatim copy of verl's `_generated_ppo_trainer.yaml`) and layers TTS
# overrides on top via the per-role subdirs:
#
#   qwen3_tts/
#   ├── qwen3_tts_trainer.yaml        # this file
#   ├── ppo_base.yaml                 # upstream PPO schema (do not edit)
#   ├── actor/qwen3_tts_actor.yaml
#   ├── ref/qwen3_tts_ref.yaml
#   ├── rollout/qwen3_tts_rollout.yaml
#   └── reward/qwen3_tts_reward.yaml
#
# Required overrides at launch:
#   actor_rollout_ref.model.path=Qwen/Qwen3-TTS-12Hz-0.6B-Base
#   data.train_files=...
#   data.val_files=...
#   reward.reward_model.base_url=http://<asr-host>:<port>

defaults:

  # Pull the full upstream PPO config (critic, transfer_queue, global_profiler,
  # actor / rollout / ref / reward, ray_kwargs, trainer, …). Everything below
  # is then a delta on top of this baseline.
  - ppo_base

  # Per-role TTS deltas merged into the right sub-paths.
  - /qwen3_tts/actor@actor_rollout_ref.actor: qwen3_tts_actor
  - /qwen3_tts/ref@actor_rollout_ref.ref: qwen3_tts_ref
  - /qwen3_tts/rollout@actor_rollout_ref.rollout: qwen3_tts_rollout
  - /qwen3_tts/reward@reward: qwen3_tts_reward

  - _self_

# Recipe-wide top-level overrides.
actor_rollout_ref:

  hybrid_engine: true

  model:
    # The Hub or local checkpoint directory for Qwen3-TTS-12Hz-0.6B-Base.
    # Upstream verl uses HFModelConfig here; do not add diffusion-only
    # fields like `architecture` / `algorithm` — those would raise
    # `TypeError: HFModelConfig.__init__() got an unexpected keyword`.
    # The TTS rollout adapter is selected via rollout.name=vllm_omni_tts
    # instead.
    path: ???

# Custom dataset class: rows are voice-cloning triples
# (prompt_text, ref_audio, ref_text, speaker_id, ref_utt_id, target_utt_id,
#  target_duration, data_source).
data:
  custom_cls:
    # upstream verl.utils.import_utils.load_module expects an absolute
    # FILE PATH to the .py module, not a dotted import path.
    path: ${oc.env:PWD}/verl_omni/utils/dataset/qwen3_tts_dataset.py
    name: Qwen3TTSDataset
  train_batch_size: 4
  val_batch_size: 4

# Override the upstream PPO algorithm to GRPO.
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

# GRPO doesn't use a critic; disable it (the upstream RayPPOTrainer skips
# critic worker construction when this is false).
critic:
  enable: false

trainer:
  project_name: verl_omni_qwen3_tts_grpo
  experiment_name: qwen3_tts_grpo_smoke
  total_training_steps: 3
  total_epochs: 1
  save_freq: 1
  test_freq: -1
  logger: ['console']
  nnodes: 1
  # 4 train GPUs (0-3); GPU 4 reserved for the remote Qwen3-ASR server.
  # train_batch_size × rollout.n (4 × 4 = 16) must be divisible by
  # n_gpus_per_node (4), so the upstream validate_config assertion passes.
  n_gpus_per_node: 4
  val_before_train: false

# Disable cross-stage transfer queue (we use vllm-omni's own orchestrator).
transfer_queue:
  enable: false
