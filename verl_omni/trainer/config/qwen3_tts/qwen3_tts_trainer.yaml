# Qwen3-TTS GRPO recipe (verl-omni)
#
# Top-level Hydra config that wraps upstream verl.trainer.main_ppo.
# Required overrides at launch time:
#   data.train_files=...
#   data.val_files=...
#   actor_rollout_ref.model.path=Qwen/Qwen3-TTS-12Hz-0.6B-Base
#   reward.reward_model.base_url=http://<asr-host>:<port>
#
# The recipe-side validator (validate_qwen3_tts_recipe_config) checks the
# required overrides BEFORE GPU work begins. See
# verl_omni/trainer/qwen3_tts_grpo/launcher.py.

defaults:
  - actor: qwen3_tts_actor
  - rollout: qwen3_tts_rollout
  - ref: qwen3_tts_ref
  - reward: qwen3_tts_reward
  - _self_

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  kl_coef: 0.0

data:
  train_files: ???
  val_files: ???
  train_batch_size: 4
  val_batch_size: 4
  custom_cls:
    path: verl_omni.utils.dataset.qwen3_tts_dataset
    name: Qwen3TTSDataset

actor_rollout_ref:
  model:
    path: ???
    architecture: Qwen3TTSPipeline
    algorithm: grpo

trainer:
  project_name: verl_omni_qwen3_tts_grpo
  experiment_name: qwen3_tts_grpo_smoke
  total_training_steps: 3
  save_freq: 1
  test_freq: -1
  logger: ['console']
