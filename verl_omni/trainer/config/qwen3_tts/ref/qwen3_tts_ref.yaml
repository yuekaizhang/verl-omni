# Reference-policy config for the Qwen3-TTS GRPO recipe.
# KL coefficient is disabled by default (kl_coef=0 in the top-level algorithm
# config); the ref module is loaded only when the trainer needs a frozen
# reference.

# @package _global_
actor_rollout_ref:
  ref:
    enable: false
    fsdp_config:
      wrap_policy:
        min_num_params: 0
