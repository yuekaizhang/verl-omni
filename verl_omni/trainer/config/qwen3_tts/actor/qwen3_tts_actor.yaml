# Actor config for the Qwen3-TTS GRPO recipe.
# Inherits the diffusion FSDP actor defaults and overrides for AR codec-token training.

# @package _global_
actor_rollout_ref:
  actor:
    fsdp_config:
      wrap_policy:
        min_num_params: 0
    ulysses_sequence_parallel_size: 1
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.0
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.0
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_remove_padding: true
