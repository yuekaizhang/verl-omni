# AR-TTS rollout overrides for the Qwen3-TTS GRPO recipe.
#
# Composed into ``actor_rollout_ref.rollout`` by the parent trainer yaml's
# ``defaults:`` entry::
#
#     - /qwen3_tts/rollout@actor_rollout_ref.rollout: qwen3_tts_rollout
#
# The diffusion-side rollout base (``/diffusion/rollout: diffusion_rollout``)
# is loaded first; the values below layer on top. Keep this file fragment
# minimal — only fields that differ from the diffusion base.

# Use the verl-omni-side TTS rollout replica registered in
# verl_omni/workers/rollout/replica.py (which also triggers the
# LLMServerManager.get_client monkey-patch that returns the AR-TTS client).
name: vllm_omni_tts

# Group sampling for GRPO. Codec-token rollouts at n>=2 form one group.
n: 4

# The Qwen3-TTS 0.6B model fits on a single GPU, and the smoke layout
# pins 1 FSDP rank per GPU (4 train GPUs total). Upstream defaults TP=2
# which makes vLLM expect 2 GPUs per worker, conflicting with FSDP's
# 1-GPU-per-rank allocation and raising
# ``AssertionError: local_world_size (2) must be less than or equal to
# the number of visible devices (1)``. Force TP=1.
tensor_model_parallel_size: 1

# Initialise the rollout engine from the .hf_cache checkpoint
# (``auto``), NOT the upstream default ``dummy`` (random weights).
#
# Qwen3-TTS's talker lazily builds ``self.speaker_encoder`` only when
# ``load_weights`` sees a ``speaker_encoder.*`` key (see
# ``qwen3_tts_talker.py:1574-1577``). With ``load_format=dummy`` no
# weights are streamed through that load path during engine init —
# the talker module is constructed without speaker_encoder, all
# params hold random tensors, and the model_executor does not see
# any ``speaker_encoder.*`` keys.
#
# The first FSDP→vLLM weight sync would normally remedy this by
# pushing the actor's ``speaker_encoder.*`` weights, but if any
# weight subset (e.g. ``code_predictor.codec_embedding`` or
# ``code_predictor.lm_head`` ModuleLists) is silently dropped by the
# FSDP unshard / mapper pipeline, those layers stay at the random
# ``dummy`` init forever — which surfaces as ``Code2Wav input_ids
# length 1 not divisible by num_quantizers 16`` warnings (the
# code_predictor emits garbage residual codes whose count isn't a
# multiple of the 16-quantizer frame size) and ``ok=False``
# transcripts across the entire batch.
#
# ``load_format=auto`` makes vLLM read the safetensors directly so
# every param has its checkpoint value at engine-init time;
# subsequent FSDP syncs then *update* whatever they cover without
# leaving any layer at random init.
load_format: auto

# AR sampling knobs forwarded into vllm.SamplingParams by the AR-TTS
# AgentLoop. Only fields present on upstream verl's RolloutConfig
# dataclass go at the top level here — see
# ``verl/workers/config/rollout.py`` for the canonical schema.
#
# Per-token max generation length is ``response_length`` (verl), not
# ``max_tokens`` (vLLM SamplingParams). Per-step extras like
# ``logprobs`` (vLLM) and ``stop_token_ids`` (vLLM SamplingParams) are
# forwarded by the AR-TTS adapter via ``engine_kwargs`` instead — adding
# them at the top level raises
# ``TypeError: RolloutConfig.__init__() got an unexpected keyword``.
temperature: 1.0
top_p: 1.0
top_k: 50
repetition_penalty: 1.05
prompt_length: 64
response_length: 4096

# Extra vLLM SamplingParams the AR-TTS AgentLoop forwards into
# ``vllm.SamplingParams`` per-request: logprobs=1 exposes per-token
# codec logprobs (needed for the GRPO importance ratio), and
# stop_token_ids=[2150] is the Qwen3-TTS codec-EOS id (per
# BL-20260517-qwen3-tts-prompt-and-stage-shape).
engine_kwargs:
  vllm:
    logprobs: 1
    stop_token_ids: [2150]

val_kwargs:
  temperature: 0.0

# Upstream verl PPO requires at least one of log_prob_micro_batch_size /
# log_prob_micro_batch_size_per_gpu to be explicitly set on the rollout
# block (check_mutually_exclusive in verl/utils/config.py).
log_prob_micro_batch_size_per_gpu: 1

agent:
  # The AR-TTS AgentLoop registered via @register decorator.
  default_agent_loop: autoregressive_tts_single_turn_agent
  # The verl-omni-side AgentLoopManager subclass that injects our worker.
  agent_loop_manager_class: verl_omni.agent_loop.autoregressive_tts_agent_loop.AutoRegressiveTTSAgentLoopManager
  agent_loop_config_path: null
