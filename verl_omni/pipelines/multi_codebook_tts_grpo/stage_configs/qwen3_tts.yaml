# verl-omni-side override of vllm_omni/model_executor/stage_configs/qwen3_tts.yaml.
#
# Diff vs upstream (RL-only changes):
#   stage 0:
#     + final_output: true            # also emit talker output to the user queue
#     + final_output_type: codec_tokens
#     + default_sampling_params.logprobs: 1   # populate per-token logprobs
#   stage 1: unchanged.
#
# Rationale: GRPO needs per-token action logprobs for the AR speech-token sequence
# sampled by the talker. vLLM's standard AR scheduler already computes them when
# SamplingParams.logprobs=N is set, and OmniRequestOutput.request_output.outputs[i]
# already carries token_ids and logprobs verbatim. The orchestrator emits a stage's
# RequestOutput to the user queue iff that stage has final_output:true. The two
# additions below are the entire change required to surface stage-0 codec tokens
# + per-token logprobs alongside the stage-1 waveform.
#
# Keep this file in sync with the upstream stage config on vllm-omni version bumps:
#   .venv/lib/python3.12/site-packages/vllm_omni/model_executor/stage_configs/qwen3_tts.yaml

async_chunk: true
stage_args:
  - stage_id: 0
    stage_type: llm
    is_comprehension: true
    runtime:
      devices: "0"
    engine_args:
      model_stage: qwen3_tts
      max_num_seqs: 10
      model_arch: Qwen3TTSTalkerForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      enforce_eager: false
      trust_remote_code: true
      async_scheduling: true
      enable_prefix_caching: false
      engine_output_type: latent
      gpu_memory_utilization: 0.3
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 512
      max_model_len: 4096
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.qwen3_tts.talker2code2wav_async_chunk
    output_connectors:
      to_stage_1: connector_of_shared_memory
    final_output: true
    final_output_type: codec_tokens
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      detokenize: false
      repetition_penalty: 1.05
      stop_token_ids: [2150]
      logprobs: 1

  - stage_id: 1
    stage_type: llm
    runtime:
      devices: "0"
    engine_args:
      model_stage: code2wav
      max_num_seqs: 1
      model_arch: Qwen3TTSCode2Wav
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: true
      enable_prefix_caching: false
      engine_output_type: audio
      gpu_memory_utilization: 0.3
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 8192
      max_model_len: 32768
    engine_input_source: [0]
    final_output: true
    final_output_type: audio
    input_connectors:
      from_stage_0: connector_of_shared_memory
    tts_args:
      max_instructions_length: 500
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    connector_of_shared_memory:
      name: SharedMemoryConnector
      extra:
        shm_threshold_bytes: 65536
        codec_streaming: true
        connector_get_sleep_s: 0.01
        connector_get_max_wait_first_chunk: 3000
        connector_get_max_wait: 300
        codec_chunk_frames: 25
        codec_left_context_frames: 25

  edges:
    - from: 0
      to: 1
      window_size: -1
